<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Birthday, My Love! ❤️</title>
    <link rel="stylesheet" href="style.css">
    <!-- Google Fonts for a nice handwriting look -->
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
</head>
<body>

    <div class="card-container">
        <div class="envelope-wrapper" id="envelope">
            <div class="envelope">
                <div class="letter">
                    <div class="text">
                        <h2>Happy Birthday, Beautiful! 🎉</h2>
                        <p>To the girl who lights up my world every single day:</p>
                        <p>Thank you for bringing so much joy, laughter, and love into my life. I hope your special day is just as amazing and wonderful as you are.</p>
                        <p class="signature">Forever yours, <br><strong>[Your Name]</strong></p>
                    </div>
                </div>
            </div>
            <div class="heart"></div>
            <div class="seal-text">Tap to Open</div>
        </div>
    </div>

    <!-- Background floating hearts -->
    <div class="hearts-bg" id="heartsBg"></div>

    <script src="script.js"></script>
</body>
</html>
