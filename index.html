<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>A Special Message</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Floating Hearts Background Container -->
  <div class="hearts-bg">
    <div class="heart h1"></div>
    <div class="heart h2"></div>
    <div class="heart h3"></div>
    <div class="heart h4"></div>
    <div class="heart h5"></div>
    <div class="heart h6"></div>
    <div class="heart h7"></div>
    <div class="heart h8"></div>
    <div class="heart h9"></div>
    <div class="heart h10"></div>
  </div>

  <!-- Interactive Envelope -->
  <div class="envelope-wrapper" id="envelope">
    <!-- Letter Card Inside -->
    <div class="letter">
      <h2>Happy Birthday! 🎂</h2>
      <p>To the girl who lights up my world every single day.</p>
      <p>Thank you for bringing so much joy, laughter, and love into my life!</p>
    </div>

    <!-- Envelope Top Flap -->
    <div class="top-flap"></div>

    <!-- Heart Seal -->
    <div class="heart-seal"></div>

    <!-- Front Pocket of Envelope -->
    <div class="pocket"></div>
  </div>

  <script src="script.js"></script>
</body>
</html>
