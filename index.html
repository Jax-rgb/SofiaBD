<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Happy Birthday</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Montserrat:wght@400;500;600&display=swap" rel="stylesheet">
</head>
<body>

  <!-- Floating Hearts Canvas -->
  <canvas id="heartCanvas"></canvas>

  <!-- Card Wrapper -->
  <div class="card-wrapper">
    <div class="card" id="birthdayCard">
      
      <!-- Front of Card -->
      <div class="card-face card-front">
        <div class="border-frame"></div>
        <div class="card-content">
          <span class="sub-title">A Special Celebration</span>
          <h1 class="title">Happy<br>Birthday</h1>
          <p class="tagline">✦ Tap to open ✦</p>
        </div>
      </div>

      <!-- Inside of Card -->
      <div class="card-face card-inside">
        <div class="border-frame"></div>
        <div class="card-content">
          <h2 class="inside-title">Wishing You Joy</h2>
          <div class="divider">❖</div>
          <p class="message">
            May your birthday be filled with endless warmth, laughter, and unforgettable magic. Wishing you a year ahead as incredible and special as you are!
          </p>
          <div class="signature">
            <span>With love & warm wishes,</span>
            <strong>[ Your Name ]</strong>
          </div>
        </div>
      </div>

    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
