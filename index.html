<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Happy Birthday</title>
  
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Montserrat:wght@400;500;600&display=swap" rel="stylesheet">

  <style>
    /* ==========================================================================
       1. Light Purple Background (Forced Overrides)
       ========================================================================== */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      width: 100% !important;
      height: 100% !important;
      margin: 0 !important;
      padding: 0 !important;
      overflow: hidden !important;
    }

    body {
      /* Soft Light Purple Gradient Background */
      background: linear-gradient(135deg, #f3e8ff 0%, #e9d5ff 50%, #c084fc 100%) !important;
      display: flex !important;
      justify-content: center !important;
      align-items: center !important;
      font-family: 'Montserrat', sans-serif;
    }

    /* Hearts Canvas */
    #heartCanvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: 1;
      pointer-events: none;
    }

    /* ==========================================================================
       2. Solid Visible Birthday Card
       ========================================================================== */
    .card-container {
      position: relative;
      z-index: 10;
      width: 88vw;
      max-width: 360px;
      height: 500px;
      margin: auto;
    }

    .card {
      width: 100%;
      height: 100%;
      position: relative;
      background: #2e1065; /* Dark Royal Purple Card Background */
      border-radius: 20px;
      box-shadow: 0 15px 35px rgba(88, 28, 135, 0.4),
                  0 0 0 2px rgba(250, 204, 21, 0.4);
      padding: 24px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      cursor: pointer;
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }

    .card:active {
      transform: scale(0.98);
    }

    /* Front & Back Panel Visibility Toggle */
    .card-front, .card-inside {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      position: absolute;
      top: 0;
      left: 0;
      padding: 30px 24px;
      box-sizing: border-box;
      transition: opacity 0.4s ease, transform 0.4s ease;
    }

    /* Initial State: Front Shown, Inside Hidden */
    .card-front {
      opacity: 1;
      visibility: visible;
      transform: scale(1);
      z-index: 2;
    }

    .card-inside {
      opacity: 0;
      visibility: hidden;
      transform: scale(0.95);
      z-index: 1;
    }

    /* Open State: Inside Shown, Front Hidden */
    .card.open .card-front {
      opacity: 0;
      visibility: hidden;
      transform: scale(0.95);
    }

    .card.open .card-inside {
      opacity: 1;
      visibility: visible;
      transform: scale(1);
    }

    /* Decorative Frames */
    .border-frame {
      position: absolute;
      top: 12px;
      left: 12px;
      right: 12px;
      bottom: 12px;
      border: 1.5px solid rgba(250, 204, 21, 0.5);
      border-radius: 14px;
      pointer-events: none;
    }

    .border-frame::after {
      content: '';
      position: absolute;
      top: 4px;
      left: 4px;
      right: 4px;
      bottom: 4px;
      border: 1px dashed rgba(250, 204, 21, 0.25);
      border-radius: 10px;
    }

    /* Typography & Text Styling */
    .sub-title {
      font-size: 0.75rem;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: #c084fc;
      margin-bottom: 16px;
      display: block;
      font-weight: 600;
    }

    .title {
      font-family: 'Cinzel', Georgia, serif;
      font-size: 2.5rem;
      line-height: 1.15;
      font-weight: 700;
      color: #ffffff;
      margin-bottom: 20px;
    }

    .tagline {
      font-size: 0.85rem;
      color: #facc15;
      letter-spacing: 1px;
    }

    .inside-title {
      font-family: 'Cinzel', Georgia, serif;
      font-size: 1.4rem;
      color: #fef08a;
      margin-bottom: 10px;
    }

    .divider {
      color: #facc15;
      font-size: 0.9rem;
      margin-bottom: 16px;
    }

    .message {
      font-size: 0.9rem;
      line-height: 1.6;
      color: #f3e8ff;
      margin-bottom: 24px;
      font-weight: 400;
    }

    .signature {
      font-size: 0.85rem;
      color: #c084fc;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .signature strong {
      color: #ffffff;
      font-family: 'Cinzel', Georgia, serif;
      font-size: 1rem;
    }
  </style>
</head>
<body>

  <!-- Floating Hearts Background -->
  <canvas id="heartCanvas"></canvas>

  <!-- Interactive Card -->
  <div class="card-container">
    <div class="card" id="birthdayCard">
      
      <!-- FRONT SIDE -->
      <div class="card-front">
        <div class="border-frame"></div>
        <h1 class="title">Happy<br>Birthday</h1>
        <span class="sub-title">Sofia,</span>
        <p class="tagline">✦ Tap ✦</p>
      </div>

      <!-- INSIDE SIDE -->
      <div class="card-inside">
        <div class="border-frame"></div>
        <h2 class="inside-title">HAPPY BIRTHDAY</h2>
        <div class="divider">❖</div>
        <p class="message">
          Thank you for always trying and giving your best, you're old too now mwa!
        </p>
        <div class="signature">
          <span>From,</span>
          <strong>Jax</strong>
        </div>
      </div>

    </div>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const card = document.getElementById('birthdayCard');
      const canvas = document.getElementById('heartCanvas');
      const ctx = canvas.getContext('2d');

      // Click / Tap Event to Open Card
      card.addEventListener('click', () => {
        card.classList.toggle('open');
      });

      // Canvas Setup
      let width, height;
      function resizeCanvas() {
        width = canvas.width = window.innerWidth;
        height = canvas.height = window.innerHeight;
      }
      window.addEventListener('resize', resizeCanvas);
      resizeCanvas();

      // Vector Heart Drawer
      function drawHeart(x, y, size, color, alpha) {
        ctx.save();
        ctx.translate(x, y);
        ctx.globalAlpha = alpha;
        ctx.fillStyle = color;
        ctx.beginPath();
        
        const topCurve = size * 0.3;
        ctx.moveTo(0, topCurve);
        ctx.bezierCurveTo(0, 0, -size / 2, 0, -size / 2, topCurve);
        ctx.bezierCurveTo(-size / 2, (size + topCurve) / 2, 0, size, 0, size);
        ctx.bezierCurveTo(0, size, size / 2, (size + topCurve) / 2, size / 2, topCurve);
        ctx.bezierCurveTo(size / 2, 0, 0, 0, 0, topCurve);
        
        ctx.closePath();
        ctx.fill();
        ctx.restore();
      }

      // Flying Hearts
      class FlyingHeart {
        constructor() {
          this.reset(true);
        }

        reset(initial = false) {
          this.x = Math.random() * width;
          this.y = initial ? Math.random() * height : height + 30;
          this.size = Math.random() * 14 + 8;
          this.speedY = Math.random() * 0.8 + 0.3;
          this.swaySpeed = Math.random() * 0.02 + 0.008;
          this.swayOffset = Math.random() * Math.PI * 2;
          this.alpha = Math.random() * 0.6 + 0.3;
          
          const colors = ['#9333ea', '#7e22ce', '#c084fc', '#e879f9', '#a855f7'];
          this.color = colors[Math.floor(Math.random() * colors.length)];
        }

        update() {
          this.y -= this.speedY;
          this.swayOffset += this.swaySpeed;
          this.x += Math.sin(this.swayOffset) * 0.6;

          if (this.y < -30) {
            this.reset(false);
          }
        }

        draw() {
          drawHeart(this.x, this.y, this.size, this.color, this.alpha);
        }
      }

      const hearts = Array.from({ length: 45 }, () => new FlyingHeart());

      function animate() {
        ctx.clearRect(0, 0, width, height);
        hearts.forEach(heart => {
          heart.update();
          heart.draw();
        });
        requestAnimationFrame(animate);
      }

      animate();
    });
  </script>
</body>
</html>
