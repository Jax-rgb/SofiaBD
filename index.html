<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Birthday Sofia</title>
    <!-- Premium Typography -->
    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Inter:wght@400;500&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-gradient: radial-gradient(circle at center, #b4a2f8 0%, #7d65e6 100%);
            --envelope-w: 360px;
            --envelope-h: 220px;
            --envelope-bg: #ffffff;
            --card-bg: #fffbf4;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            padding: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: var(--bg-gradient);
            font-family: 'Inter', sans-serif;
            overflow: hidden;
            position: relative;
        }

        /* Ambient Floating Hearts Background */
        .hearts-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            z-index: 1;
            pointer-events: none;
        }

        .heart {
            position: absolute;
            bottom: -30px;
            background-color: rgba(255, 255, 255, 0.25);
            display: inline-block;
            height: 14px;
            width: 14px;
            transform: rotate(-45deg);
            animation: floatUp 9s linear infinite;
        }

        .heart::before, .heart::after {
            content: "";
            background-color: inherit;
            border-radius: 50%;
            height: 14px;
            position: absolute;
            width: 14px;
        }
        .heart::before { top: -7px; left: 0; }
        .heart::after { left: 7px; top: 0; }

        @keyframes floatUp {
            0% { transform: translateY(0) rotate(-45deg) scale(0.6); opacity: 0; }
            15% { opacity: 1; }
            85% { opacity: 1; }
            100% { transform: translateY(-110vh) rotate(-45deg) scale(1.1); opacity: 0; }
        }

        /* 3D Scene Viewport */
        .scene {
            position: relative;
            z-index: 10;
            width: var(--envelope-w);
            height: var(--envelope-h);
            margin-top: 80px;
            perspective: 1200px; /* Gives realistic depth depth to 3D rotations */
        }

        /* Envelope Main Frame with Real 3D Depth Layering */
        .envelope-wrapper {
            position: relative;
            width: 100%;
            height: 100%;
            cursor: pointer;
            transform-style: preserve-3d;
            box-shadow: 0 20px 40px rgba(44, 33, 94, 0.25);
            border-radius: 12px;
            transition: transform 0.4s cubic-bezier(0.25, 1, 0.5, 1), box-shadow 0.4s ease;
        }

        .envelope-wrapper:hover {
            transform: translateY(-5px);
            box-shadow: 0 30px 50px rgba(44, 33, 94, 0.35);
        }

        /* Back Base Sheet of Envelope */
        .envelope-back {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: var(--envelope-bg);
            border-radius: 12px;
            transform: translateZ(0px); /* Base layer anchor */
        }

        /* Subtle inner paper shadow simulation */
        .envelope-back::after {
            content: '';
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(to bottom, rgba(0,0,0,0.06) 0%, transparent 40%);
            border-radius: 12px;
        }

        /* Flawless True 3D Top Flap Construction */
        .envelope-flap-system {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 115px;
            transform-origin: top;
            transform-style: preserve-3d;
            /* Smooth unfolding speed curve */
            transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1); 
            z-index: 5;
            transform: translateZ(2px); /* Floats safely right above the card inside */
        }

        /* Outer visible triangle side of flap */
        .flap-front {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(to bottom, #ffffff 0%, #f5f5f7 100%);
            clip-path: polygon(0 0, 100% 0, 50% 100%);
            backface-visibility: hidden; /* Disappears seamlessly when flipped upside down */
            z-index: 2;
        }

        /* Inner flip side of flap visible only when fully opened */
        .flap-back {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: #fdfdfd;
            clip-path: polygon(0 0, 100% 0, 50% 100%);
            transform: rotateX(180deg); /* Mirror position */
            backface-visibility: hidden;
            z-index: 1;
        }

        /* Triggers the 180-degree physical flip */
        .envelope-wrapper.open .envelope-flap-system {
            transform: translateZ(2px) rotateX(180deg);
        }

        /* The Premium Letter Card */
        .letter-card {
            background-color: var(--card-bg);
            background-image: radial-gradient(rgba(0,0,0,0.015) 1px, transparent 0);
            background-size: 16px 16px;
            width: calc(var(--envelope-w) - 24px);
            height: calc(var(--envelope-h) - 20px);
            position: absolute;
            bottom: 10px;
            left: 12px;
            border-radius: 8px;
            padding: 24px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            /* Places card perfectly inside the physical center of the envelope pocket */
            transform: translateZ(1px); 
            /* Delays card elevation until the 3D flap clears the upward zone */
            transition: transform 0.6s cubic-bezier(0.19, 1, 0.22, 1) 0.15s, box-shadow 0.6s ease;
            border: 1px solid rgba(0, 0, 0, 0.02);
        }

        /* Slides vertically clear out of the sleeve */
        .envelope-wrapper.open .letter-card {
            transform: translateY(-155px) translateZ(4px) scale(1.02);
            box-shadow: 0 15px 35px rgba(0,0,0,0.12);
        }

        /* Front Layer Overlap Pocket */
        .envelope-front-pocket {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 130px;
            background: linear-gradient(135deg, #ffffff 0%, #fafafa 100%);
            clip-path: polygon(0 30px, 100% 30px, 100% 100%, 0 100%);
            border-radius: 0 0 12px 12px;
            /* Locked on absolute top layer to cover the lower half of card */
            transform: translateZ(3px); 
            box-shadow: inset 0 1px 0 rgba(255,255,255,0.7);
        }

        /* Wax Seal Stamp Decoration */
        .envelope-seal {
            position: absolute;
            top: 95px;
            left: 50%;
            transform: translateX(-50%) translateZ(4px); /* Sits on top of the closed pocket */
            width: 36px;
            height: 36px;
            background: linear-gradient(135deg, #ff6b8b 0%, #e54b6d 100%);
            border-radius: 50%;
            box-shadow: 0 4px 10px rgba(229, 75, 109, 0.3), inset 0 1px 0 rgba(255,255,255,0.2);
            display: flex;
            justify-content: center;
            align-items: center;
            color: #ffffff;
            font-size: 0.95rem;
            transition: opacity 0.25s ease, transform 0.25s ease;
        }

        .envelope-seal::after { content: '♥'; }

        /* Fades away cleanly as soon as the opening action takes place */
        .envelope-wrapper.open .envelope-seal {
            opacity: 0;
            transform: translateX(-50%) translateZ(4px) scale(0.6);
            pointer-events: none;
        }

        /* Elegant Typographic System */
        h1 {
            font-family: 'Cormorant Garamond', serif;
            font-size: 1.9rem;
            color: #2c2c2c;
            margin: 0 0 14px 0;
            font-weight: 600;
            letter-spacing: -0.3px;
        }

        p {
            font-family: 'Cormorant Garamond', serif;
            font-style: italic;
            font-size: 1.25rem;
            color: #555555;
            line-height: 1.6;
            margin: 0;
            max-width: 90%;
        }

        .text-heart {
            color: #e54b6d;
            font-style: normal;
            font-size: 1.15rem;
            display: inline-block;
            margin: 0 1px;
            animation: pulse 1.8s ease infinite;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.15); }
            100% { transform: scale(1); }
        }
    </style>
</head>
<body>

    <div class="hearts-container" id="heartsContainer"></div>

    <div class="scene">
        <div class="envelope-wrapper" onclick="toggleEnvelope(this)">
            
            <!-- Structural Envelope Bottom/Back Layer -->
            <div class="envelope-back"></div>
            
            <!-- 3D Flap Component (Dual-Sided Backface Logic Included) -->
            <div class="envelope-flap-system">
                <div class="flap-front"></div>
                <div class="flap-back"></div>
            </div>
            
            <!-- Inner Greeting Letter Document -->
            <div class="letter-card">
