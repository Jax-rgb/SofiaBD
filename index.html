<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Birthday Sofia!</title>
    <style>
        /* Base Styling & Background Gradient */
        body {
            margin: 0;
            padding: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: radial-gradient(circle, #b19ffb 0%, #8c76ec 100%);
            font-family: 'Georgia', serif;
            overflow: hidden;
            position: relative;
        }

        /* Floating Hearts Background */
        .hearts-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            z-index: 1;
            pointer-events: none;
        }

        .heart {
            position: absolute;
            bottom: -20px;
            background-color: rgba(255, 255, 255, 0.4);
            display: inline-block;
            height: 16px;
            width: 16px;
            transform: rotate(-45deg);
            animation: floatUp 8s linear infinite;
        }

        .heart::before,
        .heart::after {
            content: "";
            background-color: inherit;
            border-radius: 50%;
            height: 16px;
            position: absolute;
            width: 16px;
        }

        .heart::before { top: -8px; left: 0; }
        .heart::after { left: 8px; top: 0; }

        @keyframes floatUp {
            0% { transform: translateY(0) rotate(-45deg) scale(0.5); opacity: 0; }
            10% { opacity: 0.6; }
            90% { opacity: 0.6; }
            100% { transform: translateY(-105vh) rotate(-45deg) scale(1.2); opacity: 0; }
        }

        /* Interactive Envelope Setup */
        .envelope-wrapper {
            position: relative;
            z-index: 10;
            width: 320px;
            height: 250px;
            cursor: pointer;
            margin-top: 50px; /* Room for the card to slide upwards */
        }

        /* Inner Letter Styling (Hidden Initial State) */
        .letter-card {
            background-color: #fffaf0;
            width: 290px;
            height: 160px;
            position: absolute;
            bottom: 5px;
            left: 15px;
            border-radius: 4px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 20px;
            box-sizing: border-box;
            z-index: 2;
            transition: transform 0.6s ease-in-out;
        }

        /* Sliding animation triggered by JS click */
        .envelope-wrapper.open .letter-card {
            transform: translateY(-130px);
        }

        /* White Envelope Body Front Layer */
        .envelope-front {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 320px;
            height: 180px;
            background-color: #ffffff;
            border-radius: 0 0 8px 8px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.15);
            z-index: 3; /* Sits completely in front of the letter */
        }

        /* White Envelope Flap Layer */
        .envelope-flap {
            position: absolute;
            top: 0;
            left: 0;
            width: 0;
            height: 0;
            border-left: 160px solid transparent;
            border-right: 160px solid transparent;
            border-bottom: 72px solid #f0f0f0; /* Slight gray tint for visibility */
            z-index: 4;
            transform-origin: bottom;
            transition: transform 0.4s ease;
        }

        /* Flap flips upward when opened */
        .envelope-wrapper.open .envelope-flap {
            transform: scaleY(-1) translateY(72px);
            z-index: 1; /* drops behind card when open */
        }

        /* Typography */
        h1 {
            font-size: 1.2rem;
            color: #4a4a4a;
            margin: 0 0 10px 0;
            font-weight: normal;
        }

        p {
            font-size: 0.9rem;
            color: #5a5a5a;
            line-height: 1.5;
            margin: 0;
        }

        .text-heart {
            color: #d32f2f;
            font-size: 1rem;
            display: inline-block;
        }
    </style>
</head>
<body>

    <!-- Floating Background Layer -->
    <div class="hearts-container" id="heartsContainer"></div>

    <!-- Clickable White Envelope Assembly -->
    <div class="envelope-wrapper" onclick="toggleEnvelope(this)">
        <div class="envelope-flap"></div>
        
        <!-- Hidden Letter Component -->
        <div class="letter-card">
            <h1>Happy Birthday Sofia!</h1>
            <p>Thank you for <span class="text-heart">♥</span>ys trying and giving your best!</p>
        </div>
        
        <div class="envelope-front"></div>
    </div>

    <!-- JavaScript Module -->
    <script>
        // Toggle slide-out card animation on click
        function toggleEnvelope(element) {
            element.classList.toggle('open');
        }

        // Generate Floating Background Hearts
        function createHeart() {
            const container = document.getElementById('heartsContainer');
            if (!container) return;

            const heart = document.createElement('div');
            heart.classList.add('heart');
            
            heart.style.left = Math.random() * 100 + 'vw';
            
            const sizeModifier = Math.random() * 0.6 + 0.7;
            heart.style.transform = `rotate(-45deg) scale(${sizeModifier})`;
            
            const duration = Math.random() * 4 + 6;
            heart.style.animationDuration = duration + 's';
            
            const opacity = Math.random() * 0.3 + 0.2;
            heart.style.backgroundColor = `rgba(255, 255, 255, ${opacity})`;

            container.appendChild(heart);

            setTimeout(() => {
                heart.remove();
            }, duration * 1000);
        }

        setInterval(createHeart, 400);
    </script>
</body>
</html>
